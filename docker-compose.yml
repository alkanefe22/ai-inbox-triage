services:
  n8n:
    # Pinned to the current "stable" release (not latest).
    image: docker.n8n.io/n8nio/n8n:2.41.3
    container_name: ai-inbox-triage-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Timezone: falls back to Europe/Istanbul when empty in .env
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Istanbul}
      TZ: ${TZ:-Europe/Istanbul}
      # Allow $env access in workflows (e.g. $env.GEMINI_MODEL); blocked by default in n8n 2.x
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # File nodes may only read/write these two mounted folders
      N8N_RESTRICT_FILE_ACCESS_TO: /files/data;/files/output
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/files/data
      - ./output:/files/output

volumes:
  n8n_data:
    name: ai-inbox-triage_n8n_data
